<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Chess Game Analyzer
        </title>
    </head>
        <body>
            <h1>Chess Game Analyzer</h1>
            <p><input type="text" id="pgnInput" placeholder="Paste PGN here"></p>
            <button type="button" id="analyzeButton">
            Analyze chess game.</button>
            <script type="module">
                import { Chess } from './lib/chess.js';
                
                function analyzeChessGame() {
                    const pgnInput = document.getElementById('pgnInput').value;
                    const chess = new Chess();
                    try {
                        chess.loadPgn(pgnInput);
                        document.getElementById('chessOutput').innerText = 'Game analyzed';
                    } catch (error) {
                        document.getElementById('chessOutput').innerText = 'Unable to analyze game.';
                    }
                }

                document.getElementById('analyzeButton').addEventListener('click', analyzeChessGame);

                



            </script>
            <p id="chessOutput"></p>
            
        </body>
    </html>
